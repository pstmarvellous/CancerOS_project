services:
  postgres:
    image: postgres:15.4
    profiles: [data]
    environment:
      POSTGRES_USER: canceros
      POSTGRES_DB: canceros_dev
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set private local database password}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["canceros-postgres:/var/lib/postgresql/data"]
    mem_limit: 256m
  queue:
    image: redis:8.2.1-alpine
    profiles: [data]
    command: [redis-server, /config/redis.conf]
    ports: ["127.0.0.1:56379:56379"]
    volumes: ["../.local/redis-container.conf:/config/redis.conf:ro", "canceros-redis:/data"]
    mem_limit: 128m
  storage:
    image: chrislusf/seaweedfs:4.51
    profiles: [data]
    command: [mini, "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-s3.port=8333", "-admin.ui=false", "-webdav=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Set private storage key}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set private storage secret}
      S3_BUCKET: canceros-private
    ports: ["127.0.0.1:58333:8333"]
    volumes: ["canceros-objects:/data"]
    mem_limit: 384m
volumes:
  canceros-postgres:
  canceros-redis:
  canceros-objects:
