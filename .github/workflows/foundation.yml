name: CancerOS foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: npm ci
      - run: uv run python scripts/ci_services.py
      - run: uv run python scripts/migrate_test.py
      - run: uv run python scripts/run_checks.py backend
      - run: uv run python scripts/run_checks.py frontend
      - run: uv run python scripts/run_checks.py governance
      - run: uv run python scripts/worker_smoke.py
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
