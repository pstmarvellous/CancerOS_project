[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "canceros-foundation"
version = "0.1.0"
description = "Research-only CancerOS foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "boto3==1.43.119",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "nibabel==5.4.2",
    "numpy==2.4.6",
    "psutil==7.2.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pydicom==3.0.2",
    "pyjwt[crypto]==2.15.1",
    "redis==8.1.0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/canceros"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/canceros"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires explicitly configured disposable PostgreSQL and private storage/queue"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]
